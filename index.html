<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens — Correct Prezi Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0b0b0e;
  color:#fff;
  font-family:'Playfair Display',serif;
  height:2600vh;
  overflow-x:hidden;
}

/* PIN */
.story{
  height:100vh;
  position:relative;
}

/* GRID (REFERENCE) */
.grid-bg{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

/* CAMERA CANVAS */
.canvas{
  position:fixed;
  inset:0;
  transform-origin:center center;
}

/* TEXT */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  line-height:1.35;
  transform:translate(-50%,-50%);
}

/* TYPOGRAPHY */
.hero{
  font-size:clamp(28px, 3.5vw, 42px);
  font-weight:600;
}
.secondary{
  font-size:clamp(18px, 2.2vw, 26px);
}
.idea{
  font-size:clamp(14px, 1.6vw, 18px);
  opacity:0;
}

/* CENTER */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.center-text{
  font-size:clamp(26px, 4vw, 44px);
  opacity:0;
  text-align:center;
}
</style>
</head>

<body>

<section class="story">

  <div class="grid-bg"></div>

  <div class="canvas" id="canvas">

    <!-- FIRST 6 — SPATIALLY PLACED -->
    <div class="node hero" style="top:50%;left:50%;">
      Kids don’t learn gender in classrooms.
    </div>

    <div class="node secondary" style="top:30%;left:80%;">
      They learn it in playgrounds.
    </div>

    <div class="node secondary" style="top:70%;left:20%;">
      At home.
    </div>

    <div class="node secondary" style="top:15%;left:50%;">
      In silence.
    </div>

    <div class="node secondary" style="top:85%;left:60%;">
      Through jokes.
    </div>

    <div class="node secondary" style="top:45%;left:5%;">
      Through rules no one explains.
    </div>

    <!-- IDEA FIELD -->
    <div class="node idea" style="top:10%;left:25%;">Emotions are not gendered</div>
    <div class="node idea" style="top:90%;left:35%;">Care is not weakness</div>
    <div class="node idea" style="top:85%;left:75%;">Leadership is not gendered</div>
    <div class="node idea" style="top:20%;left:75%;">Confidence is taught, not born</div>
    <div class="node idea" style="top:60%;left:90%;">Strength looks different</div>
    <div class="node idea" style="top:88%;left:10%;">Equality is learned early</div>

  </div>

  <div class="center">
    <div class="center-text" id="centerText"></div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const canvas = document.getElementById("canvas");
const ideas = gsap.utils.toArray(".idea");
const centerText = document.getElementById("centerText");

/* START — FIRST SENTENCE FULLY VISIBLE */
gsap.set(canvas,{ scale:1.6 });

/* TIMELINE */
const tl = gsap.timeline({
  scrollTrigger:{
    trigger:".story",
    start:"top top",
    end:"+=" + 18000,
    scrub:true,
    pin:true
  }
});

/* CONTINUOUS ZOOM OUT — REVEALS FIRST 6 NATURALLY */
tl.to(canvas,{ scale:1.2, duration:4 });
tl.to(canvas,{ scale:1.0, duration:4 });
tl.to(canvas,{ scale:0.8, duration:4 });
tl.to(canvas,{ scale:0.65, duration:4 });

/* CENTER STATEMENT */
tl.to(centerText,{
  onStart:()=>{
    centerText.textContent="WE DON’T TEACH.";
    gsap.to(centerText,{opacity:1,duration:0.6});
  }
});
tl.to(centerText,{
  onStart:()=>{
    centerText.textContent="WE HELP THEM NOTICE.";
  }
});
tl.to(centerText,{opacity:0,duration:0.6});

/* BIGGER PICTURE ZOOM */
tl.to(canvas,{ scale:0.45, duration:6 });

/* IDEAS APPEAR */
ideas.forEach(node=>{
  tl.to(node,{opacity:0.9,duration:1.2},">");
});
</script>

</body>
</html>
