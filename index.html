<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f1115;
  color:#f5f5f5;
  font-family:'Playfair Display',serif;
  height:4800vh;
  overflow-x:hidden;
}

/* ================= STORY ================= */
.story{
  height:100vh;
  position:relative;
}

.grid-bg{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

.canvas{
  position:fixed;
  inset:0;
  transform-origin:center center;
}

.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  transform:translate(-50%,-50%);
  opacity:0;
}

.hero{font-size:clamp(30px,3.5vw,44px)}
.secondary{font-size:clamp(18px,2.2vw,26px)}

.center{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}

.center-text{
  font-size:clamp(26px,4vw,44px);
  opacity:0;
}

/* ================= TAKEOVER ================= */
.takeover{
  height:300vh;
  position:relative;
}

/* COLUMNS */
.columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:20;
  pointer-events:none;
}

.col{
  background:#ffffff;
  transform:translateY(100%);
}

/* CONTENT */
.slide-content{
  position:fixed;
  inset:0;
  background:#ffffff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vh 12vw;
  opacity:0;
  z-index:21;
}
</style>
</head>

<body>

<!-- ================= ZOOM STORY ================= -->
<section class="story">
  <div class="grid-bg"></div>
  <div class="canvas" id="canvas">
    <div class="node hero" id="l1" style="top:50%;left:50%">Kids don’t learn gender in classrooms.</div>
    <div class="node secondary" id="l2" style="top:30%;left:80%">They learn it in playgrounds.</div>
    <div class="node secondary" id="l3" style="top:70%;left:20%">At home.</div>
    <div class="node secondary" id="l4" style="top:15%;left:50%">In silence.</div>
    <div class="node secondary" id="l5" style="top:85%;left:60%">Through jokes.</div>
    <div class="node secondary" id="l6" style="top:40%;left:10%">Online.</div>
    <div class="node secondary" id="l7" style="top:45%;left:90%">Through rules no one explains.</div>
  </div>
  <div class="center"><div class="center-text" id="centerText"></div></div>
</section>

<!-- ================= COLUMN TAKEOVER ================= -->
<section class="takeover">
  <div class="columns">
    <div class="col"></div>
    <div class="col"></div>
    <div class="col"></div>
    <div class="col"></div>
    <div class="col"></div>
    <div class="col"></div>
  </div>

  <div class="slide-content">
    <div>
      <h2>What we do</h2>
      <p>
        We design workshops and experiences that help children notice
        gender, power, and bias — without lectures.
      </p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ================= STORY ================= */
const canvas = document.getElementById("canvas");
const centerText = document.getElementById("centerText");

gsap.set(canvas,{scale:1.6});

const storyTL = gsap.timeline({
  scrollTrigger:{
    trigger:".story",
    start:"top top",
    end:"+="+14000,
    scrub:true,
    pin:true
  }
});

function focus(cur,prev=null){
  storyTL.to(canvas,{scale:"-=0.12",duration:0.5})
         .to(cur,{opacity:1,duration:0.4});
  if(prev) storyTL.to(prev,{opacity:0.25,duration:0.4},"<");
}

focus("#l1");
focus("#l2","#l1");
focus("#l3","#l2");
focus("#l4","#l3");
focus("#l5","#l4");
focus("#l6","#l5");
focus("#l7","#l6");

storyTL.to(".node",{opacity:0,duration:0.4});
storyTL.to(centerText,{onStart:()=>{centerText.textContent="WE DON’T LECTURE.";gsap.to(centerText,{opacity:1})}});
storyTL.to(centerText,{onStart:()=>{centerText.textContent="WE HELP THEM NOTICE."}}); 
storyTL.to(centerText,{opacity:0});
storyTL.to(canvas,{scale:0.28,duration:3});

/* ================= PIANO COLUMN TAKEOVER ================= */
const cols = gsap.utils.toArray(".col");

const takeoverTL = gsap.timeline({
  scrollTrigger:{
    trigger:".takeover",
    start:"top top",
    end:"+="+ (cols.length * 400),
    pin:true,
    scrub:false
  }
});

cols.forEach(col=>{
  takeoverTL.to(col,{
    y:"0%",
    duration:0.25,
    ease:"power2.out"
  });
});

takeoverTL.to(".slide-content",{opacity:1,duration:0.4});
</script>

</body>
</html>
