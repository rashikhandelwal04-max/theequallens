<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* BACKGROUND QUOTES */
.world{
  position:fixed;
  inset:0;
  z-index:2;
}

.idea{
  position:absolute;
  font-size:clamp(13px,1.1vw,17px);
  color:#dbe1ea;
  opacity:0.08;
  letter-spacing:.4px;
  transition:all .35s ease;
}

.idea:hover{
  opacity:0.75;
  color:#ffffff;
  text-shadow:0 0 14px rgba(255,255,255,.35);
  transform:scale(1.08);
}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
  z-index:3;
}

.line:last-child{
  z-index:5;
}

.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.top-right{top:18%;right:12%}
.top-left{top:22%;left:10%}
.middle-right{top:52%;right:10%}
.middle-left{top:55%;left:10%}
.bottom-center{bottom:18%;left:50%;transform:translateX(-50%)}

.spacer{height:260vh}

/* VIDEO */
.video-takeover{height:200vh}

.video-columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:4;
  pointer-events:none;
}

.video-col{
  transform:translateY(100%);
}

.video-col video{
  position:absolute;
  inset:0;
  width:600%;
  height:100%;
  object-fit:cover;
}

.video-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vw;
  background:rgba(0,0,0,0.45);
  opacity:0;
  z-index:6;
}

.video-overlay a{
  padding:14px 34px;
  background:#fff;
  color:#000;
  text-decoration:none;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<div class="narrative">
  <div class="line center">Kids don’t learn gender in classrooms.</div>
  <div class="line top-right">They learn it in playgrounds.</div>
  <div class="line middle-left">At home.</div>
  <div class="line bottom-center">In silence.</div>
  <div class="line top-left">Through jokes.</div>
  <div class="line middle-right">Online.</div>
  <div class="line center">WE DON’T LECTURE.</div>
  <div class="line center">WE HELP THEM NOTICE.</div>
</div>

<div class="spacer"></div>

<section class="video-takeover">
  <div class="video-columns">
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
  </div>

  <div class="video-overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>We help children notice gender and power — through play, not lectures.</p>
      <a href="about.html" class="about-link">About Us</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);
gsap.defaults({ease:"power2.out"});

/* 60 BACKGROUND PHRASES */
const phrases = [
"emotions are not gender specific","freedom is a choice","boys can cry","girls can lead",
"strength has no gender","care is power","labels limit","let kids be kids","pink is not a rule",
"blue is not a rule","play has no gender","respect over roles","listen first","kindness is strength",
"identity is personal","no toy is wrong","feelings are human","voice matters","no role is fixed",
"fairness begins early","break the script","question the norm","curiosity over bias","share the space",
"equal ≠ same","choice matters","power can be gentle","gentle can be powerful","notice patterns",
"change starts small","words shape worlds","notice who speaks","notice who is silent","who decides?",
"who benefits?","rewrite rules","grow beyond boxes","labels are lazy","expand empathy","care counts",
"soft is strong","brave is kind","everyone belongs","fair play matters","stories shape beliefs",
"notice the joke","notice the silence","notice the pattern","notice the gap","change the habit",
"learn differently","see clearly","question loudly","include more","bias is learned",
"unlearn early","equal voices","shared power","human first"
];

const world=document.getElementById("world");

phrases.forEach((t,i)=>{
  const el=document.createElement("div");
  el.className="idea";
  el.textContent=t;

  const col = i % 10;
  const row = Math.floor(i/10);

  el.style.left = (col*10 + Math.random()*6) + "%";
  el.style.top  = (row*14 + Math.random()*8) + "%";

  world.appendChild(el);
});

/* SMOOTH NARRATIVE SCROLL */
const lines=gsap.utils.toArray(".line");

const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=2200",
    scrub:1.2,
    pin:true
  }
});

lines.forEach((line,i)=>{
  tl.fromTo(line,
    {opacity:0,y:40,filter:"blur(6px)"},
    {opacity:1,y:0,filter:"blur(0px)",duration:0.6}
  );

  if(i<6){
    tl.to(line,{
      opacity:0.12,
      filter:"blur(1px)",
      duration:0.6
    },">+0.9");
  } else {
    tl.to(line,{
      opacity:0,
      duration:0.5
    },">+0.9");
  }
});

/* VIDEO COLUMN REVEAL */
ScrollTrigger.create({
  trigger:".video-takeover",
  start:"top+=200 top",
  end:"+=900",
  pin:true,
  onUpdate:self=>{
    document.querySelectorAll(".video-col").forEach((c,i)=>{
      if(self.progress>i/6){
        gsap.to(c,{y:0,duration:0.5});
      }
    });
  }
});

/* VIDEO OVERLAY */
ScrollTrigger.create({
  trigger:".video-takeover",
  start:"center center",
  onEnter:()=>gsap.to(".video-overlay",{opacity:1}),
  onLeaveBack:()=>gsap.to(".video-overlay",{opacity:0})
});

/* ABOUT TRANSITION */
document.querySelector(".about-link").onclick=e=>{
  e.preventDefault();
  gsap.to("body",{opacity:0,scale:0.96,duration:0.35,onComplete:()=>location.href=e.target.href});
};
</script>

</body>
</html>
