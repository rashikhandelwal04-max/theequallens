<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* IDEA FIELD */
.world{
  position:fixed;
  inset:0;
  z-index:2;
}

.idea{
  position:absolute;
  font-size:clamp(14px,1.3vw,18px);
  color:#cfd4dc;
  opacity:0.08;
  transition:opacity .3s ease;
}
.idea:hover{opacity:1}
.idea.dim{opacity:0.03}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
}

/* SECTIONS */
.spacer{height:200vh}

/* VIDEO */
.video-section{
  height:100vh;
  position:relative;
}

.video-section video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vw;
}

.video-overlay h2{
  font-size:clamp(28px,4vw,46px);
  margin-bottom:20px;
}

.video-overlay p{
  max-width:560px;
  font-size:18px;
  line-height:1.6;
  margin:0 auto 30px;
}

.video-overlay a{
  display:inline-block;
  padding:12px 28px;
  border:1px solid #fff;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.video-overlay a:hover{
  background:#fff;
  color:#000;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<!-- INTRO TEXT -->
<div class="narrative">
  <div class="line" id="l1">Kids don’t learn gender in classrooms.</div>
  <div class="line" id="l2">They learn it in playgrounds.</div>
  <div class="line" id="l3">At home.</div>
  <div class="line" id="l4">In silence.</div>
  <div class="line" id="l5">Through jokes.</div>
  <div class="line" id="l6">Online.</div>
</div>

<div class="spacer"></div>

<!-- VIDEO -->
<section class="video-section">
  <video src="intro-video.mp4" muted loop autoplay playsinline></video>
  <div class="video-overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>
        We create spaces where children notice gender, power,
        and bias — not through lectures, but through observation,
        play, and reflection.
      </p>
      <a href="about.html">About Us</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* IDEAS */
const phrases=[
  "Care is not weakness","Bias is learned","Confidence is taught",
  "Equality is practiced","Language shapes belief","Silence teaches norms",
  "Play teaches power","Roles are absorbed","Fairness is modeled"
];
const world=document.getElementById("world");

for(let i=0;i<60;i++){
  const d=document.createElement("div");
  d.className="idea";
  d.textContent=phrases[i%phrases.length];
  d.style.left=(Math.random()*120-10)+"%";
  d.style.top=(Math.random()*120-10)+"%";
  world.appendChild(d);
}

/* HOVER */
document.querySelectorAll(".idea").forEach(el=>{
  el.addEventListener("mouseenter",()=>{
    document.querySelectorAll(".idea").forEach(o=>o!==el&&o.classList.add("dim"));
  });
  el.addEventListener("mouseleave",()=>{
    document.querySelectorAll(".idea").forEach(o=>o.classList.remove("dim"));
  });
});

/* TEXT SEQUENCE */
const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=1800",
    scrub:true,
    pin:true
  }
});

["#l1","#l2","#l3","#l4","#l5","#l6"].forEach(id=>{
  tl.to(id,{opacity:1,duration:0.4})
    .to(id,{opacity:0,duration:0.4},">+0.6");
});
</script>

</body>
</html>
