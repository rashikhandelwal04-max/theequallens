<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* PHRASE FIELD */
.world{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none; /* allow text scroll area */
}

.idea{
  position:absolute;
  font-size:clamp(13px,1.1vw,17px);
  color:#e7ecf3;
  opacity:0.14;
  transition:all .25s ease;
  letter-spacing:.4px;
  pointer-events:auto;   /* enable hover */
  cursor:default;
}

.idea:hover{
  opacity:1;
  color:#ffffff;
  text-shadow:0 0 16px rgba(255,255,255,.55);
  transform:scale(1.15);
}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
  text-shadow:0 6px 30px rgba(0,0,0,.7);
}

.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.top-right{top:18%;right:12%}
.top-left{top:22%;left:10%}
.middle-right{top:52%;right:10%}
.middle-left{top:55%;left:10%}
.bottom-center{bottom:18%;left:50%;transform:translateX(-50%)}

.spacer{height:260vh}

/* VIDEO SECTION */

.video-section{
  height:200vh;
  position:relative;
  z-index:4;
}

.video-columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  pointer-events:none;
}

.video-col{
  overflow:hidden;
  transform:translateY(100%);
}

.video-col video{
  width:600%;
  height:100%;
  object-fit:cover;
}

/* TITLE OVER VIDEO */

.video-title{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  opacity:0;
  pointer-events:none;
}

.video-title h1{
  font-size:clamp(42px,7vw,92px);
  font-weight:600;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<div class="narrative">
  <div class="line center">Kids don’t learn gender in classrooms.</div>
  <div class="line top-right">They learn it in playgrounds.</div>
  <div class="line middle-left">At home.</div>
  <div class="line bottom-center">In silence.</div>
  <div class="line top-left">Through jokes.</div>
  <div class="line middle-right">Online.</div>
  <div class="line center">We don’t lecture.</div>
  <div class="line center">We help them notice.</div>
</div>

<div class="spacer"></div>

<section class="video-section">

  <div class="video-columns">
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
    <div class="video-col"><video src="intro-video.mp4" muted loop autoplay></video></div>
  </div>

  <div class="video-title">
    <h1>Equal Lens</h1>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ===== PHRASES ===== */

const phrases=[ "emotions are not gender specific","freedom is a choice","boys can cry","girls can lead",
"strength has no gender","care is power","labels limit","let kids be kids","pink is not a rule",
"blue is not a rule","play has no gender","respect over roles","listen first","kindness is strength",
"identity is personal","no toy is wrong","feelings are human","voice matters","no role is fixed",
"fairness begins early","break the script","question the norm","curiosity over bias","share the space",
"equal ≠ same","choice matters","power can be gentle","gentle can be powerful","notice patterns",
"change starts small","words shape worlds","notice who speaks","notice who is silent","rewrite rules",
"grow beyond boxes","expand empathy","care counts","soft is strong","brave is kind","everyone belongs" ];

const world=document.getElementById("world");

phrases.forEach((t,i)=>{
  const el=document.createElement("div");
  el.className="idea";
  el.textContent=t;
  el.style.left=(Math.random()*92)+"%";
  el.style.top=(Math.random()*92)+"%";
  world.appendChild(el);
});

/* ===== TEXT SCROLL ===== */

const lines=gsap.utils.toArray(".line");

const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=2200",
    scrub:1.2,
    pin:true
  }
});

lines.forEach((line,i)=>{
  tl.fromTo(line,
    {opacity:0,y:40,filter:"blur(6px)"},
    {opacity:1,y:0,filter:"blur(0px)",duration:0.6}
  );

  if(i<6){
    tl.to(line,{opacity:0.15,filter:"blur(1px)"},">+0.9");
  } else {
    tl.to(line,{opacity:0},">+0.9");
  }
});

/* ===== VIDEO COLUMN REVEAL ===== */

ScrollTrigger.create({
  trigger:".video-section",
  start:"top top",
  end:"+=900",
  pin:true,
  onUpdate:self=>{
    document.querySelectorAll(".video-col").forEach((c,i)=>{
      if(self.progress > i/6){
        gsap.to(c,{y:0,duration:0.6,ease:"power2.out"});
      }
    });
  }
});

/* ===== TITLE ANIMATION ===== */

gsap.to(".video-title",{
  opacity:1,
  scale:1,
  duration:1.2,
  scrollTrigger:{
    trigger:".video-section",
    start:"top+=300 top"
  }
});
</script>

</body>
</html>
