<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* ===== GRID ===== */
.grid-bg{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:0;
}

/* ===== STORY ===== */
.story{
  min-height:600vh;
}

.slide{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
}

.slide p{
  max-width:600px;
  font-size:clamp(22px,4vw,38px);
  line-height:1.4;
  opacity:0;
}

/* ===== CENTER STATEMENT ===== */
.statement{
  font-size:clamp(26px,4.5vw,44px);
  letter-spacing:0.5px;
}

/* ===== IDEAS ===== */
.ideas{
  position:relative;
  min-height:150vh;
}

.idea{
  position:absolute;
  font-size:clamp(14px,1.4vw,18px);
  color:#cfd4dc;
  opacity:0.15;
  transition:opacity .3s ease;
}

@media (hover:hover){
  .idea:hover{opacity:1}
  .idea.dim{opacity:0.04}
}

/* ===== IMAGE SECTIONS ===== */
.media{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.media img{
  width:100%;
  height:100vh;
  object-fit:cover;
}

.media .overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,0.35);
  font-size:clamp(26px,4vw,44px);
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<section class="story">

  <!-- NARRATIVE -->
  <div class="slide"><p id="l1">Kids don’t learn gender in classrooms.</p></div>
  <div class="slide"><p id="l2">They learn it in playgrounds.</p></div>
  <div class="slide"><p id="l3">At home.</p></div>
  <div class="slide"><p id="l4">In silence.</p></div>
  <div class="slide"><p id="l5">Through jokes.</p></div>
  <div class="slide"><p id="l6">Online.</p></div>
  <div class="slide"><p id="l7">Through rules no one explains.</p></div>

  <!-- STATEMENT -->
  <div class="slide"><p class="statement">WE DON’T LECTURE.</p></div>
  <div class="slide"><p class="statement">WE HELP THEM NOTICE.</p></div>

  <!-- IDEAS -->
  <div class="ideas" id="ideas"></div>

</section>

<!-- IMAGE -->
<section class="media">
  <img src="workshop.jpg" alt="">
  <div class="overlay">What we do</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* Fade narrative */
document.querySelectorAll(".slide p").forEach(p=>{
  gsap.to(p,{
    opacity:1,
    scrollTrigger:{
      trigger:p,
      start:"top 60%",
      end:"top 30%",
      scrub:true
    }
  });
});

/* Ideas */
const ideasText=[
  "Care is not weakness","Bias is learned","Confidence is taught",
  "Equality is practiced","Language shapes belief","Silence teaches norms",
  "Play teaches power","Roles are absorbed","Fairness is modeled"
];

const ideas=document.getElementById("ideas");

for(let i=0;i<50;i++){
  const d=document.createElement("div");
  d.className="idea";
  d.textContent=ideasText[i%ideasText.length];
  d.style.left=Math.random()*90+"%";
  d.style.top=Math.random()*90+"%";
  ideas.appendChild(d);
}

/* Hover focus */
document.querySelectorAll(".idea").forEach(el=>{
  el.addEventListener("mouseenter",()=>{
    document.querySelectorAll(".idea").forEach(o=>{
      if(o!==el) o.classList.add("dim");
    });
  });
  el.addEventListener("mouseleave",()=>{
    document.querySelectorAll(".idea").forEach(o=>o.classList.remove("dim"));
  });
});
</script>

</body>
</html>
