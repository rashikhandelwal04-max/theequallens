<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* IDEAS */
.world{
  position:fixed;
  inset:0;
  z-index:3;
}

.idea{
  position:absolute;
  font-size:clamp(14px,1.2vw,18px);
  color:#cfd4dc;
  opacity:0.18;
  transition:opacity .3s ease, transform .3s ease;
}

.idea.focus{opacity:1;transform:scale(1.15)}
.idea.dim{opacity:0.05}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:520px;
  font-size:clamp(24px,3.5vw,42px);
  line-height:1.4;
  opacity:0;
  transition:opacity .4s ease;
}

.line.active{opacity:1}
.line.dim{opacity:0.25}
.line.hidden{opacity:0}

/* POSITIONS */
.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.left{top:45%;left:10%}
.right{top:40%;right:10%}
.top-left{top:15%;left:12%}
.bottom-left{bottom:15%;left:12%}
.bottom-right{bottom:18%;right:12%}

.spacer{height:240vh}

/* VIDEO */
.video-takeover{height:200vh}

.video-columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:4;
  pointer-events:none;
}

.video-col{
  transform:translateY(100%);
}

.video-col video{
  position:absolute;
  inset:0;
  width:600%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

.video-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vw;
  background:rgba(0,0,0,0.45);
  opacity:0;
  z-index:6;
  pointer-events:auto;
}

.video-overlay a{
  padding:14px 34px;
  background:#fff;
  color:#000;
  text-decoration:none;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<!-- NARRATIVE -->
<div class="narrative">
  <div class="line center">Kids don’t learn gender in classrooms.</div>
  <div class="line right">They learn it in playgrounds.</div>
  <div class="line left">At home.</div>
  <div class="line bottom-right">In silence.</div>
  <div class="line top-left">Through jokes.</div>
  <div class="line bottom-left">Online.</div>

  <div class="line center">WE DON’T LECTURE.</div>
  <div class="line center">WE HELP THEM NOTICE.</div>
</div>

<div class="spacer"></div>

<section class="video-takeover">
  <div class="video-columns">
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
  </div>

  <div class="video-overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>We help children notice gender and power — through play, not lectures.</p>
      <a href="about.html" class="about-link">About Us</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const lines = gsap.utils.toArray(".line");

/* NARRATIVE TIMELINE */
const tl = gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=1800",
    scrub:true,
    pin:true
  }
});

lines.forEach((line,i)=>{
  tl.add(()=>{
    lines.forEach((l,idx)=>{
      l.classList.remove("active","dim","hidden");
      if(idx < i) l.classList.add("dim");
      if(idx === i) l.classList.add("active");
      if(idx > i) l.classList.add("hidden");
    });
  }, i*1);
});

/* FINAL TWO LINES RULE */
tl.add(()=>{
  lines.forEach((l,idx)=>{
    if(idx < 6) l.classList.add("hidden");
  });
}, 6);

/* ABOUT TRANSITION */
document.querySelector(".about-link").onclick=e=>{
  e.preventDefault();
  gsap.to("body",{opacity:0,scale:0.96,duration:0.35,onComplete:()=>location.href=e.target.href});
};
</script>

</body>
</html>
