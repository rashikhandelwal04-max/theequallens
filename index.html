<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f1115;
  color:#f5f5f5;
  font-family:'Playfair Display',serif;
  height:2400vh;
  overflow-x:hidden;
}

/* PIN */
.story{height:100vh;position:relative}

/* GRID */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

/* CAMERA */
.canvas{
  position:fixed;inset:0;
  transform-origin:center center;
}

/* TEXT */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  line-height:1.35;
  transform:translate(-50%,-50%);
  opacity:0;
}

/* TYPOGRAPHY */
.hero{font-size:clamp(30px,3.5vw,44px);font-weight:600}
.secondary{font-size:clamp(18px,2.2vw,26px)}

/* IDEAS */
.idea{
  font-size:clamp(14px,1.3vw,17px);
  color:#cfd4dc;
  opacity:0.06;
  transition:opacity .4s ease;
}

/* HOVER FOCUS */
@media (hover:hover){
  .idea:hover{opacity:1}
  .idea.dim{opacity:0.025}
}

/* CENTER */
.center{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.center-text{
  font-size:clamp(26px,4vw,44px);
  opacity:0;text-align:center;
  letter-spacing:0.6px;
}

/* AFFORDANCE */
.affordance{
  position:fixed;
  bottom:6%;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  color:#9ca3af;
  opacity:0;
  pointer-events:none;
}

/* MEMORY ECHO */
.echo{
  position:fixed;
  bottom:10%;
  right:8%;
  font-size:16px;
  color:#9ca3af;
  opacity:0;
}

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<section class="story">
  <div class="grid-bg"></div>

  <div class="canvas" id="canvas">
    <div class="node hero" id="l1" style="top:50%;left:50%">Kids don’t learn gender in classrooms.</div>
    <div class="node secondary" id="l2" style="top:30%;left:80%">They learn it in playgrounds.</div>
    <div class="node secondary" id="l3" style="top:70%;left:20%">At home.</div>
    <div class="node secondary" id="l4" style="top:15%;left:50%">In silence.</div>
    <div class="node secondary" id="l5" style="top:85%;left:60%">Through jokes.</div>
    <div class="node secondary" id="l6" style="top:40%;left:10%">Online.</div>
    <div class="node secondary" id="l7" style="top:45%;left:90%">Through rules no one explains.</div>
  </div>

  <div class="center"><div class="center-text" id="centerText"></div></div>
  <div class="affordance" id="affordance">Hover to focus. Scroll to notice.</div>
  <div class="echo" id="echo">Kids don’t learn gender in classrooms.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const canvas=document.getElementById("canvas");
const centerText=document.getElementById("centerText");
const affordance=document.getElementById("affordance");
const echo=document.getElementById("echo");

gsap.set(canvas,{scale:1.6});

const tl=gsap.timeline({
  scrollTrigger:{trigger:".story",start:"top top",end:"+="+14000,scrub:true,pin:true}
});

/* NARRATIVE WITH FOCUS */
function focus(current, previous=null){
  tl.to(canvas,{scale:"-=0.12",duration:0.5})
    .to(current,{opacity:1,y:-8,duration:0.4});
  if(previous){
    tl.to(previous,{opacity:0.25,y:0,duration:0.4},"<");
  }
}

focus("#l1");
focus("#l2","#l1");
focus("#l3","#l2");
focus("#l4","#l3");
focus("#l5","#l4");
focus("#l6","#l5");
focus("#l7","#l6");

/* BREATHING PAUSE */
tl.to({},{duration:0.6});

/* CLEAR */
tl.to(".node",{opacity:0,duration:0.4});

/* CENTER STATEMENT */
tl.to(centerText,{onStart:()=>{centerText.textContent="WE DON’T LECTURE.";gsap.to(centerText,{opacity:1})}});
tl.to(centerText,{onStart:()=>{centerText.textContent="WE HELP THEM NOTICE."}}); 
tl.to(centerText,{opacity:0});

/* ZOOM OUT */
tl.to(canvas,{scale:0.28,duration:3});

/* AFFORDANCE (ONCE) */
tl.to(affordance,{opacity:0.8,duration:0.6});
tl.to(affordance,{opacity:0,duration:0.6},">+1");

/* IDEAS — DENSITY ZONES */
const ideas=[
"Emotions are not gendered","Care is not weakness","Empathy is strength",
"Leadership is not gendered","Power is learned","Rules are absorbed",
"Confidence is taught","Strength looks different","Fairness can be taught",
"Bias is absorbed young","Respect is learned","Language shapes belief",
"Children notice patterns","Norms repeat quietly","Learning starts early",
"Play teaches power","Systems teach","Culture teaches","Change starts early"
];

ideas.forEach((text,i)=>{
  const d=document.createElement("div");
  d.className="node idea";
  d.textContent=text;

  let zone=i%3;
  if(zone===0){d.style.left=(10+Math.random()*25)+"%";d.style.top=(15+Math.random()*60)+"%";}
  if(zone===1){d.style.left=(40+Math.random()*20)+"%";d.style.top=(10+Math.random()*70)+"%";}
  if(zone===2){d.style.left=(70+Math.random()*20)+"%";d.style.top=(20+Math.random()*60)+"%";}

  canvas.appendChild(d);

  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    gsap.to(d,{
      x:(Math.random()*10-5),
      y:(Math.random()*10-5),
      duration:30+Math.random()*20,
      repeat:-1,yoyo:true,ease:"sine.inOut"
    });
  }

  if(window.matchMedia("(hover:hover)").matches){
    d.addEventListener("mouseenter",()=>{
      document.querySelectorAll(".idea").forEach(o=>{if(o!==d)o.classList.add("dim")});
    });
    d.addEventListener("mouseleave",()=>{
      document.querySelectorAll(".idea").forEach(o=>o.classList.remove("dim"));
    });
  }
});

/* MEMORY ECHO */
tl.to(echo,{opacity:0.6,duration:1});
</script>

</body>
</html>
