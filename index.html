<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */

.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  z-index:1;
  pointer-events:none;
}

/* SPLIT VIDEO — ENTERS FROM TOP */

.split-video{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:3;
  pointer-events:none;
}

.split-col{
  overflow:hidden;
  transform:translateY(-100%); /* from top */
  opacity:.26;
}

.split-col video{
  width:600%;
  height:100%;
  object-fit:cover;
  filter:saturate(1.2) contrast(1.05);
}

/* PHRASES */

.world{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.idea{
  position:absolute;
  font-size:clamp(13px,1.1vw,17px);
  color:#cfd6e2;
  opacity:0.18;
  transition:all .25s ease;
  pointer-events:auto;
  padding:2px 6px;
  border-radius:6px;
}

.idea:hover{
  opacity:1;
  color:#ffe082;
  background:rgba(255,224,130,.14);
  text-shadow:0 0 14px rgba(255,200,80,.6);
  transform:scale(1.15);
}

/* TEXT */

.narrative{
  position:fixed;
  inset:0;
  z-index:4;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
  text-shadow:0 6px 30px rgba(0,0,0,.75);
}

.line.final{
  font-weight:700;
  text-transform:uppercase;
  font-size:clamp(34px,5vw,58px);
  letter-spacing:1px;
}

/* POSITIONS */

.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.top-right{top:18%;right:12%}
.top-left{top:22%;left:10%}
.middle-right{top:52%;right:10%}
.middle-left{top:55%;left:10%}
.bottom-center{bottom:18%;left:50%;transform:translateX(-50%)}

.spacer{height:260vh}
</style>
</head>

<body>

<div class="grid"></div>

<!-- SPLIT VIDEO -->
<div class="split-video">
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
  <div class="split-col"><video src="intro-video.mp4" muted autoplay loop></video></div>
</div>

<div class="world" id="world"></div>

<div class="narrative">
  <div class="line center">Kids don’t learn gender in classrooms.</div>
  <div class="line top-right">They learn it in playgrounds.</div>
  <div class="line middle-left">At home.</div>
  <div class="line bottom-center">In silence.</div>
  <div class="line top-left">Through jokes.</div>
  <div class="line middle-right">Online.</div>
  <div class="line center final">WE DON’T LECTURE.</div>
  <div class="line center final">WE HELP THEM NOTICE.</div>
</div>

<div class="spacer"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* PHRASES */

const phrases=[
"emotions are not gender specific","freedom is a choice","boys can cry",
"girls can lead","strength has no gender","care is power","labels limit",
"break the script","question the norm","equal ≠ same","expand empathy",
"everyone belongs","notice the joke","notice the silence",
"change the habit","include more","bias is learned","equal voices"
];

const world=document.getElementById("world");

phrases.forEach(t=>{
  const el=document.createElement("div");
  el.className="idea";
  el.textContent=t;
  el.style.left=(Math.random()*92)+"%";
  el.style.top=(Math.random()*92)+"%";
  world.appendChild(el);
});

/* TEXT SCROLL */

const lines=gsap.utils.toArray(".line");

const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=2200",
    scrub:1.2,
    pin:true
  }
});

lines.forEach(line=>{
  tl.fromTo(line,
    {opacity:0,y:40,filter:"blur(6px)"},
    {opacity:1,y:0,filter:"blur(0px)",duration:0.6}
  );

  if(!line.classList.contains("final")){
    tl.to(line,{opacity:0.15,filter:"blur(1px)"},">+0.9");
  } else {
    tl.to(line,{opacity:0},">+1.2");
  }
});

/* VIDEO ENTERS FROM TOP — STARTS EARLY */

ScrollTrigger.create({
  trigger:".spacer",
  start:"top+=40 top",   // start almost immediately
  end:"bottom top",
  scrub:true,
  onUpdate:self=>{
    document.querySelectorAll(".split-col").forEach((c,i)=>{
      if(self.progress > i/6){
        gsap.to(c,{y:0,duration:0.7,ease:"power2.out"});
      }
    });
  }
});

/* FINAL TEXT GLOW */

gsap.fromTo(".final",
  {textShadow:"0 0 0 rgba(255,255,255,0)"},
  {textShadow:"0 0 22px rgba(255,255,255,.6)",repeat:-1,yoyo:true,duration:1.6}
);
</script>

</body>
</html>
