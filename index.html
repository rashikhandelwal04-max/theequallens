<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  height:600vh;
  overflow-x:hidden;
}

/* ===== GRID ===== */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  z-index:1;
  pointer-events:none;
}

/* ===== WORLD (ZOOMS) ===== */
.world{
  position:fixed;
  inset:0;
  transform-origin:center center;
  z-index:2;
}

/* ===== IDEAS ===== */
.idea{
  position:absolute;
  font-size:clamp(14px,1.3vw,18px);
  color:#cfd4dc;
  opacity:0.08;
  transition:opacity .3s ease;
}
.idea:hover{opacity:1}
.idea.dim{opacity:0.03}

/* ===== NARRATIVE ===== */
.narrative{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
}

/* ===== SPACERS ===== */
.section{height:200vh}

/* ===== TAKEOVER ===== */
.takeover{
  position:relative;
  height:200vh;
}

.columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:5;
  pointer-events:none;
}

.col{
  transform:translateY(100%);
  overflow:hidden;
}

/* IMAGE SLICE */
.col.img{
  background-image:url("workshop.jpg");
  background-size:600% auto;
  background-repeat:no-repeat;
  background-position-y:center;
}
.col.img:nth-child(1){background-position-x:0%}
.col.img:nth-child(2){background-position-x:20%}
.col.img:nth-child(3){background-position-x:40%}
.col.img:nth-child(4){background-position-x:60%}
.col.img:nth-child(5){background-position-x:80%}
.col.img:nth-child(6){background-position-x:100%}

/* VIDEO SLICE */
.video-col video{
  position:absolute;
  top:0;left:0;
  width:600%;
  height:100%;
  object-fit:cover;
}
.video-col:nth-child(1) video{left:0%}
.video-col:nth-child(2) video{left:-100%}
.video-col:nth-child(3) video{left:-200%}
.video-col:nth-child(4) video{left:-300%}
.video-col:nth-child(5) video{left:-400%}
.video-col:nth-child(6) video{left:-500%}

/* TEXT OVER MEDIA */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12vw;
  background:rgba(0,0,0,0.35);
  opacity:0;
  z-index:6;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<!-- ===== INTRO ===== -->
<div class="narrative">
  <div class="line" id="l1">Kids don’t learn gender in classrooms.</div>
  <div class="line" id="l2">They learn it in playgrounds.</div>
  <div class="line" id="l3">At home.</div>
  <div class="line" id="l4">In silence.</div>
  <div class="line" id="l5">Through jokes.</div>
  <div class="line" id="l6">Online.</div>
</div>

<div class="section"></div>

<!-- ===== WORKSHOP ===== -->
<section class="takeover" id="workshop">
  <div class="columns">
    <div class="col img"></div><div class="col img"></div><div class="col img"></div>
    <div class="col img"></div><div class="col img"></div><div class="col img"></div>
  </div>
  <div class="overlay">
    <div>
      <h2>What we do</h2>
      <p>Workshops that help children notice bias — without lectures.</p>
    </div>
  </div>
</section>

<!-- ===== VIDEO ===== -->
<section class="takeover" id="video">
  <div class="columns">
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted loop autoplay playsinline></video></div>
  </div>
  <div class="overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>For children learning who they are — before anyone explains it.</p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ===== IDEAS ===== */
const world=document.getElementById("world");
const phrases=[
  "Care is not weakness","Bias is learned","Confidence is taught",
  "Equality is practiced","Language shapes belief","Silence teaches norms",
  "Play teaches power","Roles are absorbed","Fairness is modeled"
];

for(let i=0;i<60;i++){
  const d=document.createElement("div");
  d.className="idea";
  d.textContent=phrases[i%phrases.length];
  d.style.left=(Math.random()*120-10)+"%";
  d.style.top=(Math.random()*120-10)+"%";
  world.appendChild(d);
}

/* Hover highlight */
document.querySelectorAll(".idea").forEach(el=>{
  el.addEventListener("mouseenter",()=>{
    document.querySelectorAll(".idea").forEach(o=>o!==el&&o.classList.add("dim"));
  });
  el.addEventListener("mouseleave",()=>{
    document.querySelectorAll(".idea").forEach(o=>o.classList.remove("dim"));
  });
});

/* ===== INTRO TIMELINE ===== */
const intro=gsap.timeline({
  scrollTrigger:{
    trigger:".section",
    start:"top top",
    end:"+=2000",
    scrub:true,
    pin:true
  }
});

["#l1","#l2","#l3","#l4","#l5","#l6"].forEach(id=>{
  intro.to(id,{opacity:1,duration:0.4})
       .to(id,{opacity:0,duration:0.4},">+0.6");
});

intro.to(world,{scale:0.4,duration:1.5},"<");

/* ===== TAKEOVERS ===== */
document.querySelectorAll(".takeover").forEach(section=>{
  const cols=section.querySelectorAll(".col");
  const overlay=section.querySelector(".overlay");

  ScrollTrigger.create({
    trigger:section,
    start:"top top",
    end:"+=900",
    pin:true,
    onUpdate:self=>{
      cols.forEach((c,i)=>{
        if(self.progress>i/cols.length){
          gsap.to(c,{y:0,duration:0.3});
        }
      });
    }
  });

  ScrollTrigger.create({
    trigger:section,
    start:"center center",
    onEnter:()=>gsap.to(overlay,{opacity:1}),
    onLeaveBack:()=>gsap.to(overlay,{opacity:0})
  });
});
</script>

</body>
</html>
