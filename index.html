<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* IDEAS */
.world{
  position:fixed;
  inset:0;
  z-index:2;
}

.idea{
  position:absolute;
  font-size:clamp(14px,1.2vw,18px);
  color:#cfd4dc;
  opacity:0.18;
  transition:opacity .3s ease, transform .3s ease, color .3s ease;
  pointer-events:auto;
}

.idea.focus{
  opacity:1;
  color:#fff;
  transform:scale(1.15);
}

.idea.dim{opacity:0.05}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
}

/* POSITIONS — EXPLICIT */
.center{top:50%;left:50%;transform:translate(-50%,-50%)}

.top-right{top:18%;right:12%}
.top-left{top:22%;left:10%}
.middle-right{top:52%;right:10%}
.middle-left{top:55%;left:10%}
.bottom-center{bottom:18%;left:50%;transform:translateX(-50%)}

.spacer{height:240vh}

/* VIDEO */
.video-takeover{height:200vh}

.video-columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:4;
  pointer-events:none;
}

.video-col{
  transform:translateY(100%);
}

.video-col video{
  position:absolute;
  inset:0;
  width:600%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* OVERLAY */
.video-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vw;
  background:rgba(0,0,0,0.4);
  opacity:0;
  z-index:6;
  pointer-events:auto;
}

.video-overlay a{
  padding:14px 34px;
  background:#fff;
  color:#000;
  text-decoration:none;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<!-- NARRATIVE -->
<div class="narrative">
  <!-- 1 -->
  <div class="line center">Kids don’t learn gender in classrooms.</div>
  <!-- 2 -->
  <div class="line top-right">They learn it in playgrounds.</div>
  <!-- 3 -->
  <div class="line middle-left">At home.</div>
  <!-- 4 -->
  <div class="line bottom-center">In silence.</div>
  <!-- 5 -->
  <div class="line top-left">Through jokes.</div>
  <!-- 6 -->
  <div class="line middle-right">Online.</div>

  <!-- FINAL -->
  <div class="line center">WE DON’T LECTURE.</div>
  <div class="line center">WE HELP THEM NOTICE.</div>
</div>

<div class="spacer"></div>

<section class="video-takeover">
  <div class="video-columns">
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
  </div>

  <div class="video-overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>We help children notice gender and power — through play, not lectures.</p>
      <a href="about.html" class="about-link">About Us</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* IDEAS (ALWAYS PRESENT) */
const phrases=[/* same 50–60 as before */];
const world=document.getElementById("world");
const ideas=[];

phrases.forEach(t=>{
  const el=document.createElement("div");
  el.className="idea";
  el.textContent=t;
  el.style.left=Math.random()*100+"%";
  el.style.top=Math.random()*100+"%";
  world.appendChild(el);
  ideas.push(el);

  el.onmouseenter=()=>{
    ideas.forEach(o=>o!==el&&o.classList.add("dim"));
    el.classList.add("focus");
  };
  el.onmouseleave=()=>{
    ideas.forEach(o=>o.classList.remove("dim"));
    el.classList.remove("focus");
  };
});

/* NARRATIVE LOGIC */
const lines=gsap.utils.toArray(".line");

const tl=gsap.timeline({
  scrollTrigger:{
    trigger:".spacer",
    start:"top top",
    end:"+=1800",
    scrub:true,
    pin:true
  }
});

lines.forEach((line,i)=>{
  tl.to(line,{opacity:1,duration:0.3})
    .to(line,{opacity:i<6?0.25:0,duration:0.3},">+0.6");
});

/* When final lines appear, hide first six */
tl.to(lines.slice(0,6),{opacity:0,duration:0.2});

/* VIDEO */
ScrollTrigger.create({
  trigger:".video-takeover",
  start:"top+=200 top",
  end:"+=900",
  pin:true,
  onUpdate:self=>{
    document.querySelectorAll(".video-col").forEach((c,i)=>{
      if(self.progress>i/6){
        gsap.to(c,{y:0,duration:0.4});
      }
    });
  }
});

ScrollTrigger.create({
  trigger:".video-takeover",
  start:"center center",
  onEnter:()=>gsap.to(".video-overlay",{opacity:1}),
  onLeaveBack:()=>gsap.to(".video-overlay",{opacity:0})
});

/* ABOUT FIX */
document.querySelector(".about-link").onclick=e=>{
  e.preventDefault();
  gsap.to("body",{opacity:0,scale:0.96,duration:0.35,onComplete:()=>location.href=e.target.href});
};
</script>

</body>
</html>
