<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f1115;
  color:#f5f5f5;
  font-family:'Playfair Display',serif;
  height:6200vh;
  overflow-x:hidden;
}

/* ================= BACKGROUND GRID ================= */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* ================= CANVAS ================= */
.canvas{
  position:fixed;
  inset:0;
  transform-origin:center center;
  z-index:2;
}

/* ================= NARRATIVE ================= */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  transform:translate(-50%,-50%);
  opacity:0;
  z-index:3;
}

.hero{font-size:clamp(30px,3.5vw,44px)}
.secondary{font-size:clamp(18px,2.2vw,26px)}

.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:4;
}

.center-text{
  font-size:clamp(26px,4vw,44px);
  opacity:0;
  text-align:center;
}

/* ================= IDEAS ================= */
.idea{
  position:absolute;
  font-size:clamp(13px,1.2vw,16px);
  color:#cfd4dc;
  opacity:0.06;
  z-index:5;
  transition:opacity .3s ease;
}

@media(hover:hover){
  .idea:hover{opacity:0.9}
  .idea.dim{opacity:0.02}
}

/* ================= TAKEOVERS ================= */
.takeover{
  height:220vh;
  position:relative;
}

.columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:10;
  pointer-events:none;
}

.col{
  overflow:hidden;
  transform:translateY(100%);
}

/* IMAGE SLICE */
.col.img{
  background-size:600% auto;
  background-repeat:no-repeat;
  background-position-y:50%;
}
.col.img:nth-child(1){background-position-x:0%}
.col.img:nth-child(2){background-position-x:20%}
.col.img:nth-child(3){background-position-x:40%}
.col.img:nth-child(4){background-position-x:60%}
.col.img:nth-child(5){background-position-x:80%}
.col.img:nth-child(6){background-position-x:100%}

/* VIDEO SLICE */
.video-col video{
  position:absolute;
  top:0;
  left:0;
  width:600%;
  height:100%;
  object-fit:cover;
}
.video-col:nth-child(1) video{left:0%}
.video-col:nth-child(2) video{left:-100%}
.video-col:nth-child(3) video{left:-200%}
.video-col:nth-child(4) video{left:-300%}
.video-col:nth-child(5) video{left:-400%}
.video-col:nth-child(6) video{left:-500%}

/* TAKEOVER TEXT */
.slide-content{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vh 12vw;
  background:rgba(0,0,0,0.35);
  color:#fff;
  opacity:0;
  z-index:12;
}

/* ================= MOBILE ADJUST ================= */
@media(max-width:768px){
  .columns{grid-template-columns:repeat(3,1fr)}
  .video-col video{width:300%}
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<div class="canvas" id="canvas">
  <div class="node hero" id="l1" style="top:50%;left:50%">Kids don’t learn gender in classrooms.</div>
  <div class="node secondary" id="l2" style="top:30%;left:80%">They learn it in playgrounds.</div>
  <div class="node secondary" id="l3" style="top:70%;left:20%">At home.</div>
  <div class="node secondary" id="l4" style="top:15%;left:50%">In silence.</div>
  <div class="node secondary" id="l5" style="top:85%;left:60%">Through jokes.</div>
  <div class="node secondary" id="l6" style="top:40%;left:10%">Online.</div>
  <div class="node secondary" id="l7" style="top:45%;left:90%">Through rules no one explains.</div>
</div>

<div class="center">
  <div class="center-text" id="centerText"></div>
</div>

<!-- TAKEOVER 1 -->
<section class="takeover">
  <div class="columns">
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
    <div class="col img" style="background-image:url('workshop.jpg')"></div>
  </div>
  <div class="slide-content">
    <h2>What we do</h2>
  </div>
</section>

<!-- TAKEOVER 2 -->
<section class="takeover">
  <div class="columns">
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
    <div class="col video-col"><video src="intro-video.mp4" muted autoplay loop playsinline></video></div>
  </div>
  <div class="slide-content">
    <h2>THE EQUAL LENS</h2>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* STORY */
const canvas=document.getElementById("canvas");
const centerText=document.getElementById("centerText");

gsap.set(canvas,{scale:1.6});

const storyTL=gsap.timeline({
  scrollTrigger:{trigger:document.body,start:"top top",end:"+="+12000,scrub:true,pin:true}
});

function focus(cur,prev=null){
  storyTL.to(canvas,{scale:"-=0.12"})
         .to(cur,{opacity:1});
  if(prev) storyTL.to(prev,{opacity:0.25},"<");
}

["#l1","#l2","#l3","#l4","#l5","#l6","#l7"].forEach((id,i,arr)=>focus(id,arr[i-1]));

storyTL.to(".node",{opacity:0});
storyTL.to(centerText,{onStart:()=>{centerText.textContent="WE DON’T LECTURE.";gsap.to(centerText,{opacity:1})}});
storyTL.to(centerText,{onStart:()=>{centerText.textContent="WE HELP THEM NOTICE."}}); 
storyTL.to(centerText,{opacity:0});
storyTL.to(canvas,{scale:0.28});

/* IDEAS */
const ideas=[
"Care is not weakness","Bias is learned","Language shapes belief","Silence teaches norms",
"Play teaches power","Confidence is taught","Equality is practiced"
];

for(let i=0;i<60;i++){
  const d=document.createElement("div");
  d.className="idea";
  d.textContent=ideas[i%ideas.length];
  d.style.left=Math.random()*100+"%";
  d.style.top=Math.random()*100+"%";
  canvas.appendChild(d);
}

/* HOVER */
if(window.matchMedia("(hover:hover)").matches){
  document.querySelectorAll(".idea").forEach(el=>{
    el.addEventListener("mouseenter",()=>{
      document.querySelectorAll(".idea").forEach(o=>{if(o!==el)o.classList.add("dim")});
    });
    el.addEventListener("mouseleave",()=>{
      document.querySelectorAll(".idea").forEach(o=>o.classList.remove("dim"));
    });
  });
}

/* TAKEOVERS */
document.querySelectorAll(".takeover").forEach(section=>{
  const cols=[...section.querySelectorAll(".col")];
  const content=section.querySelector(".slide-content");

  cols.forEach(col=>gsap.set(col,{y:"100%",shown:false}));

  ScrollTrigger.create({
    trigger:section,
    start:"top top",
    end:"+="+(cols.length*150),
    pin:true,
    onUpdate:self=>{
      const step=Math.floor(self.progress*cols.length);
      cols.forEach((col,i)=>{
        if(i<=step && !col.shown){
          col.shown=true;
          gsap.to(col,{y:"0%",duration:0.3,ease:"power3.out"});
        }
      });
    }
  });

  ScrollTrigger.create({
    trigger:section,
    start:"center center",
    onEnter:()=>gsap.to(content,{opacity:1}),
    onLeaveBack:()=>gsap.to(content,{opacity:0})
  });
});
</script>

</body>
</html>
