<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  background:#0f1115;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* GRID */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
  z-index:1;
}

/* IDEAS */
.world{
  position:fixed;
  inset:0;
  z-index:3; /* ABOVE narrative */
}

.idea{
  position:absolute;
  font-size:clamp(14px,1.2vw,18px);
  color:#cfd4dc;
  opacity:0.18;
  transition:opacity .3s ease, transform .3s ease;
  pointer-events:auto;
}

.idea.focus{
  opacity:1;
  transform:scale(1.15);
}

.idea.dim{opacity:0.04}

/* NARRATIVE */
.narrative{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  pointer-events:none;
}

.line{
  position:absolute;
  max-width:640px;
  text-align:center;
  font-size:clamp(26px,4vw,44px);
  line-height:1.4;
  opacity:0;
}

/* show first line initially */
.line.initial{opacity:1}

.spacer{height:220vh}

/* VIDEO */
.video-takeover{height:200vh}

.video-columns{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:4;
  pointer-events:none;
}

.video-col{
  transform:translateY(100%);
  overflow:hidden;
}

.video-col video{
  position:absolute;
  inset:0;
  width:600%;
  height:100%;
  object-fit:cover;
  pointer-events:none; /* IMPORTANT */
}

.video-col:nth-child(1) video{left:0%}
.video-col:nth-child(2) video{left:-100%}
.video-col:nth-child(3) video{left:-200%}
.video-col:nth-child(4) video{left:-300%}
.video-col:nth-child(5) video{left:-400%}
.video-col:nth-child(6) video{left:-500%}

/* OVERLAY */
.video-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vw;
  background:rgba(0,0,0,0.45);
  opacity:0;
  z-index:6;
  pointer-events:auto;
}

.video-overlay a{
  padding:14px 34px;
  background:#fff;
  color:#000;
  text-decoration:none;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="world" id="world"></div>

<!-- NARRATIVE -->
<div class="narrative">
  <div class="line initial">Kids don’t learn gender in classrooms.</div>
  <div class="line">They learn it in playgrounds.</div>
  <div class="line">At home.</div>
  <div class="line">In silence.</div>
  <div class="line">Through jokes.</div>
  <div class="line">Online.</div>
  <div class="line">WE DON’T LECTURE.</div>
  <div class="line">WE HELP THEM NOTICE.</div>
</div>

<div class="spacer"></div>

<section class="video-takeover">
  <div class="video-columns">
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
    <div class="video-col"><video src="intro-video.mp4" autoplay muted loop></video></div>
  </div>

  <div class="video-overlay">
    <div>
      <h2>The Equal Lens</h2>
      <p>We help children notice gender and power — through play, not lectures.</p>
      <a href="about.html" class="about-link">About Us</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* IDEAS */
const phrases=[
  "Care is not weakness","Bias is learned","Confidence is taught","Equality is practiced",
  "Play teaches power","Silence teaches norms","Roles are absorbed","Fairness is modeled",
  "Boys cry","Girls lead","Work has no gender","Listening is strength",
  "Children notice everything","Power hides in habits","Words leave residue",
  "Observation precedes change","Seeing comes first","Notice before judging"
];

const world=document.getElementById("world");
const ideas=[];

phrases.forEach((t,i)=>{
  const el=document.createElement("div");
  el.className="idea";
  el.textContent=t;
  el.style.left=Math.random()*90+"%";
  el.style.top=Math.random()*90+"%";
  el.dataset.depth=Math.random()*0.6+0.2;
  world.appendChild(el);
  ideas.push(el);

  el.addEventListener("mouseenter",()=>{
    ideas.forEach(o=>o!==el&&o.classList.add("dim"));
    el.classList.add("focus");
  });
  el.addEventListener("mouseleave",()=>{
    ideas.forEach(o=>o.classList.remove("dim"));
    el.classList.remove("focus");
  });
});

/* NARRATIVE SCROLL */
gsap.utils.toArray(".line").forEach((line,i)=>{
  gsap.to(line,{
    opacity:1,
    scrollTrigger:{
      trigger:".spacer",
      start:`top+=${i*200} top`,
      end:`top+=${i*200+120} top`,
      scrub:true
    }
  });
});

/* PARALLAX */
ScrollTrigger.create({
  trigger:".spacer",
  start:"top top",
  end:"bottom bottom",
  scrub:true,
  onUpdate:self=>{
    ideas.forEach(el=>{
      gsap.to(el,{
        y:-120*self.progress*el.dataset.depth,
        overwrite:true
      });
    });
  }
});

/* VIDEO */
ScrollTrigger.create({
  trigger:".video-takeover",
  start:"top+=200 top",
  end:"+=900",
  pin:true,
  onUpdate:self=>{
    document.querySelectorAll(".video-col").forEach((c,i)=>{
      if(self.progress>i/6){
        gsap.to(c,{y:0,duration:0.4});
      }
    });
  }
});

ScrollTrigger.create({
  trigger:".video-takeover",
  start:"center center",
  onEnter:()=>gsap.to(".video-overlay",{opacity:1}),
  onLeaveBack:()=>gsap.to(".video-overlay",{opacity:0})
});

/* TRANSITION */
document.querySelector(".about-link").onclick=e=>{
  e.preventDefault();
  gsap.to("body",{opacity:0,scale:0.96,duration:0.35,onComplete:()=>location.href=e.target.href});
};
</script>

</body>
</html>
