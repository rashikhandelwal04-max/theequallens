<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f1115;
  color:#f5f5f5;
  font-family:'Playfair Display',serif;
  height:2200vh;
  overflow-x:hidden;
}

/* PIN */
.story{
  height:100vh;
  position:relative;
}

/* GRID */
.grid-bg{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

/* CAMERA */
.canvas{
  position:fixed;
  inset:0;
  transform-origin:center center;
}

/* TEXT */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  line-height:1.35;
  transform:translate(-50%,-50%);
  opacity:0;
}

/* TYPOGRAPHY */
.hero{
  font-size:clamp(30px, 3.5vw, 44px);
  font-weight:600;
}
.secondary{
  font-size:clamp(18px, 2.2vw, 26px);
}

/* IDEAS (BACKGROUND QUOTES) */
.idea{
  font-size:clamp(14px, 1.3vw, 17px);
  color:#cfd4dc;
  opacity:0.08; /* 🔥 DIMMER */
  transition:opacity .4s ease;
}

/* HOVER FOCUS */
@media (hover:hover){
  .idea:hover{
    opacity:1;
  }
  .idea.dim{
    opacity:0.03;
  }
}

/* CENTER TEXT */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.center-text{
  font-size:clamp(26px, 4vw, 44px);
  opacity:0;
  text-align:center;
  letter-spacing:0.6px;
}

/* MOBILE */
@media(max-width:768px){
  .idea{font-size:15px}
}
</style>
</head>

<body>

<section class="story">

  <div class="grid-bg"></div>

  <div class="canvas" id="canvas">

    <!-- NARRATIVE (ALL START INVISIBLE) -->
    <div class="node hero" id="l1" style="top:50%;left:50%;">Kids don’t learn gender in classrooms.</div>
    <div class="node secondary" id="l2" style="top:30%;left:80%;">They learn it in playgrounds.</div>
    <div class="node secondary" id="l3" style="top:70%;left:20%;">At home.</div>
    <div class="node secondary" id="l4" style="top:15%;left:50%;">In silence.</div>
    <div class="node secondary" id="l5" style="top:85%;left:60%;">Through jokes.</div>
    <div class="node secondary" id="l6" style="top:40%;left:10%;">Online.</div>
    <div class="node secondary" id="l7" style="top:45%;left:90%;">Through rules no one explains.</div>

  </div>

  <div class="center">
    <div class="center-text" id="centerText"></div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const canvas = document.getElementById("canvas");
const centerText = document.getElementById("centerText");

/* START */
gsap.set(canvas,{ scale:1.6 });

const tl = gsap.timeline({
  scrollTrigger:{
    trigger:".story",
    start:"top top",
    end:"+=" + 12000,
    scrub:true,
    pin:true
  }
});

/* SEQUENTIAL FOCUS FUNCTION */
function focusLine(current, previous=null){
  tl.to(canvas,{ scale:"-=0.12", duration:0.5 })
    .to(current,{ opacity:1, duration:0.4 })
  if(previous){
    tl.to(previous,{ opacity:0.25, duration:0.4 },"<");
  }
}

/* NARRATIVE FLOW */
focusLine("#l1");
focusLine("#l2","#l1");
focusLine("#l3","#l2");
focusLine("#l4","#l3");
focusLine("#l5","#l4");
focusLine("#l6","#l5");
focusLine("#l7","#l6");

/* CLEAR NARRATIVE COMPLETELY */
tl.to("#l1,#l2,#l3,#l4,#l5,#l6,#l7",{ opacity:0, duration:0.4 });

/* CENTER STATEMENT */
tl.to(centerText,{
  onStart:()=>{
    centerText.textContent="WE DON’T LECTURE.";
    gsap.to(centerText,{opacity:1,duration:0.4});
  }
});
tl.to(centerText,{
  onStart:()=>{
    centerText.textContent="WE HELP THEM NOTICE.";
  }
});
tl.to(centerText,{ opacity:0, duration:0.4 });

/* BIG PICTURE ZOOM */
tl.to(canvas,{ scale:0.28, duration:3 });

/* IDEA FIELD */
const ideas = [
  "Emotions are not gendered","Care is not weakness","Leadership is not gendered",
  "Confidence is taught, not born","Strength looks different","Equality is learned early",
  "Bias is absorbed young","Roles are learned","Fairness can be taught",
  "Opportunity shapes outcomes","Kindness is strength","Empathy is a skill",
  "Silence teaches norms","Children notice patterns","Respect is learned",
  "Ability isn’t fixed","Choices matter","Learning starts early",
  "Social rules are taught","Norms are repeated","Beliefs form quietly",
  "Language shapes thinking","Play teaches power","Visibility matters",
  "Representation matters","Care builds strength","Freedom needs safety",
  "Questioning is healthy","Gender is observed","Rules are absorbed",
  "Power is learned","Fairness is modeled","Confidence grows with support",
  "Skills need opportunity","Expectations shape outcomes",
  "Equality needs practice","Children mirror adults",
  "Change starts early","Awareness can be taught",
  "Observation precedes belief","Bias isn’t natural"
];

const cols = window.innerWidth < 768 ? 4 : 8;
const rows = Math.ceil(ideas.length / cols);
const spacingX = 100 / (cols + 1);
const spacingY = 100 / (rows + 1);

ideas.forEach((text,i)=>{
  const col = i % cols;
  const row = Math.floor(i / cols);

  const d = document.createElement("div");
  d.className="node idea";
  d.textContent=text;

  d.style.left = (spacingX * (col + 1) + (Math.random()*3-1.5)) + "%";
  d.style.top  = (spacingY * (row + 1) + (Math.random()*3-1.5)) + "%";

  canvas.appendChild(d);

  /* DRIFT */
  gsap.to(d,{
    x:(Math.random()*10-5),
    y:(Math.random()*10-5),
    duration:25 + Math.random()*20,
    repeat:-1,
    yoyo:true,
    ease:"sine.inOut"
  });

  /* HOVER DIM */
  if(window.matchMedia("(hover:hover)").matches){
    d.addEventListener("mouseenter",()=>{
      document.querySelectorAll(".idea").forEach(o=>{
        if(o!==d) o.classList.add("dim");
      });
    });
    d.addEventListener("mouseleave",()=>{
      document.querySelectorAll(".idea").forEach(o=>{
        o.classList.remove("dim");
      });
    });
  }
});
</script>

</body>
</html>
