<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f1115;
  color:#f5f5f5;
  font-family:'Playfair Display',serif;
  height:2400vh;
  overflow-x:hidden;
}

/* PIN */
.story{height:100vh;position:relative}

/* GRID */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

/* CAMERA */
.canvas{
  position:fixed;inset:0;
  transform-origin:center center;
}

/* TEXT */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  line-height:1.35;
  transform:translate(-50%,-50%);
  opacity:0;
}

/* TYPOGRAPHY */
.hero{font-size:clamp(30px,3.5vw,44px);font-weight:600}
.secondary{font-size:clamp(18px,2.2vw,26px)}
.idea{
  font-size:clamp(14px,1.3vw,17px);
  color:#cfd4dc;
  opacity:0.08;
  transition:opacity .4s ease, transform .4s ease;
  cursor:pointer;
}

/* HOVER FOCUS */
@media(hover:hover){
  .idea:hover{opacity:1}
  .idea.dim{opacity:0.03}
}

/* IDEA EXPANSION */
.idea.focused{
  opacity:1 !important;
  transform:translate(-50%,-50%) scale(1.05);
}

/* MICRO PROMPT */
.prompt{
  position:fixed;
  bottom:6%;
  width:100%;
  text-align:center;
  font-size:15px;
  color:#9ca3af;
  opacity:0;
  pointer-events:none;
}

/* CENTER TEXT */
.center{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.center-text{
  font-size:clamp(26px,4vw,44px);
  opacity:0;text-align:center;
}

/* FINAL REFLECTION */
.final{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
}
.final p{
  font-size:clamp(22px,3.5vw,36px);
  margin-bottom:24px;
}
.final button{
  background:none;
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;
  padding:10px 18px;
  margin:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<section class="story">
  <div class="grid-bg"></div>

  <div class="canvas" id="canvas">
    <!-- NARRATIVE -->
    <div class="node hero" id="l1" style="top:50%;left:50%">Kids don’t learn gender in classrooms.</div>
    <div class="node secondary" id="l2" style="top:30%;left:80%">They learn it in playgrounds.</div>
    <div class="node secondary" id="l3" style="top:70%;left:20%">At home.</div>
    <div class="node secondary" id="l4" style="top:15%;left:50%">In silence.</div>
    <div class="node secondary" id="l5" style="top:85%;left:60%">Through jokes.</div>
    <div class="node secondary" id="l6" style="top:40%;left:10%">Online.</div>
    <div class="node secondary" id="l7" style="top:45%;left:90%">Through rules no one explains.</div>
  </div>

  <div class="center"><div class="center-text" id="centerText"></div></div>
  <div class="prompt" id="prompt"></div>

  <div class="final" id="final">
    <p>What did you learn without being taught?</p>
    <button>I’m still thinking</button>
    <button>I want to talk about this</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const canvas=document.getElementById("canvas");
const centerText=document.getElementById("centerText");
const prompt=document.getElementById("prompt");
const final=document.getElementById("final");

/* START */
gsap.set(canvas,{scale:1.6});

const tl=gsap.timeline({
  scrollTrigger:{trigger:".story",start:"top top",end:"+="+14000,scrub:true,pin:true}
});

/* SEQUENTIAL NARRATIVE */
["#l1","#l2","#l3","#l4","#l5","#l6","#l7"].forEach((id,i)=>{
  tl.to(canvas,{scale:"-=0.12",duration:0.5})
    .to(id,{opacity:1,duration:0.4})
    .to(id,{opacity:0.25,duration:0.4},">+0.4");
});

/* CLEAR */
tl.to(".node",{opacity:0,duration:0.4});

/* CENTER STATEMENT */
tl.to(centerText,{onStart:()=>{centerText.textContent="WE DON’T LECTURE.";gsap.to(centerText,{opacity:1})}});
tl.to(centerText,{onStart:()=>{centerText.textContent="WE HELP THEM NOTICE."}}); 
tl.to(centerText,{opacity:0});

/* BIG ZOOM */
tl.to(canvas,{scale:0.28,duration:3});

/* IDEAS */
const ideas=[
"Emotions are not gendered","Care is not weakness","Leadership is not gendered",
"Confidence is taught","Strength looks different","Equality is learned early",
"Bias is absorbed young","Respect is learned","Language shapes belief",
"Children notice patterns","Norms repeat quietly","Power is learned"
];

ideas.forEach((text,i)=>{
  const d=document.createElement("div");
  d.className="node idea";
  d.textContent=text;
  d.style.left=(10+Math.random()*80)+"%";
  d.style.top=(10+Math.random()*80)+"%";
  canvas.appendChild(d);
});

/* MICRO PROMPTS */
const prompts=[
"Where did you first learn this?",
"Who taught you this rule?",
"Did anyone say it out loud?",
"What did you copy without realizing?"
];
let pi=0;
setInterval(()=>{
  prompt.textContent=prompts[pi++%prompts.length];
  gsap.fromTo(prompt,{opacity:0},{opacity:1,duration:1,yoyo:true,repeat:1,repeatDelay:2});
},5000);

/* CLICK TO FOCUS */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("idea")){
    document.querySelectorAll(".idea").forEach(i=>i.classList.add("dim"));
    e.target.classList.remove("dim");
    e.target.classList.toggle("focused");
  }else{
    document.querySelectorAll(".idea").forEach(i=>{
      i.classList.remove("dim","focused");
    });
  }
});

/* FINAL */
tl.to(final,{opacity:1,pointerEvents:"auto"});
</script>

</body>
</html>
