<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Equal Lens — Ordered Zoom Reveal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0b0b0e;
  color:#fff;
  font-family:'Playfair Display',serif;
  height:2600vh;
  overflow-x:hidden;
}

/* PIN */
.story{
  height:100vh;
  position:relative;
}

/* GRID */
.grid-bg{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size:160px 160px;
  pointer-events:none;
}

/* CAMERA */
.canvas{
  position:fixed;
  inset:0;
  transform-origin:center center;
}

/* TEXT */
.node{
  position:absolute;
  max-width:520px;
  text-align:center;
  line-height:1.35;
  transform:translate(-50%,-50%);
  opacity:0;
}

/* TYPOGRAPHY */
.hero{
  font-size:clamp(28px, 3.5vw, 42px);
  font-weight:600;
}
.secondary{
  font-size:clamp(18px, 2.2vw, 26px);
}

/* CENTER */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.center-text{
  font-size:clamp(26px, 4vw, 44px);
  opacity:0;
  text-align:center;
}
</style>
</head>

<body>

<section class="story">

  <div class="grid-bg"></div>

  <div class="canvas" id="canvas">

    <!-- ORDERED NARRATIVE -->
    <div class="node hero" id="l1" style="top:50%;left:50%;">
      Kids don’t learn gender in classrooms.
    </div>

    <div class="node secondary" id="l2" style="top:30%;left:80%;">
      They learn it in playgrounds.
    </div>

    <div class="node secondary" id="l3" style="top:70%;left:20%;">
      At home.
    </div>

    <div class="node secondary" id="l4" style="top:15%;left:50%;">
      In silence.
    </div>

    <div class="node secondary" id="l5" style="top:85%;left:60%;">
      Through jokes.
    </div>

    <div class="node secondary" id="l6" style="top:45%;left:5%;">
      Through rules no one explains.
    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const canvas = document.getElementById("canvas");

/* START: FIRST LINE FULLY VISIBLE */
gsap.set(canvas,{ scale:1.6 });
gsap.set("#l1",{ opacity:1 });

const tl = gsap.timeline({
  scrollTrigger:{
    trigger:".story",
    start:"top top",
    end:"+=" + 16000,
    scrub:true,
    pin:true
  }
});

/* ZOOM + STEP REVEALS (THIS IS THE KEY FIX) */

// zoom → line 2
tl.to(canvas,{ scale:1.4, duration:3 });
tl.to("#l2",{ opacity:1, duration:0.6 });

// zoom → line 3
tl.to(canvas,{ scale:1.2, duration:3 });
tl.to("#l3",{ opacity:1, duration:0.6 });

// zoom → line 4
tl.to(canvas,{ scale:1.0, duration:3 });
tl.to("#l4",{ opacity:1, duration:0.6 });

// zoom → line 5
tl.to(canvas,{ scale:0.85, duration:3 });
tl.to("#l5",{ opacity:1, duration:0.6 });

// zoom → line 6
tl.to(canvas,{ scale:0.7, duration:3 });
tl.to("#l6",{ opacity:1, duration:0.6 });

</script>

</body>
</html>
